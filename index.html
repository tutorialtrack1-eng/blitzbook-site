<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1B4B">
  <title>BlitzBook - Billing &amp; Accounts, made simple</title>
  <!-- Dark or light before the first paint: the choice made with the top-bar button, else the system setting (see Theme in js/app.js) -->
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('blitzbook.theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); } catch (e) { /* storage blocked */ }</script>
  <!-- Installable as an app: Android / desktop Chrome offer "Install", iPhone / iPad use Safari > Share > Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BlitzBook">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322D3EE'/%3E%3Cstop offset='.5' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%23E879F9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M35 8 14 36h15l-3 20 24-30H35z' fill='white'/%3E%3C/svg%3E">
  <!-- Optional web font; without a connection the portal falls back to the system font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="root"></div>
  <div id="dialogs"></div>
  <script src="js/native.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/subscription.js"></script>
  <script src="js/appformat.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/print.js"></script>
  <script src="js/app.js"></script>
  <script src="js/business.js"></script>
  <script src="js/invoice.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/money.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/gst.js"></script>
  <script src="js/migrate.js"></script>
  <script src="js/companies.js"></script>
  <script src="js/licences.js"></script>
  <script src="js/professional.js"></script>
  <script src="js/hr.js"></script>
  <script src="js/aside.js"></script>
  <script src="js/procure.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/manpower.js"></script>
  <script src="js/hotel.js"></script>
  <script src="js/modreports.js"></script>
  <script src="js/mail.js"></script>
  <script>
    // The books are loaded from IndexedDB (moved out of localStorage the first time) before the portal starts
    Store.init().then(function () { App.start(); });
    // The offline shell (sw.js) needs http(s); opened as a file the portal simply runs without it
    // A new version of the portal is looked for whenever the tab comes back into view; once it has taken over, a bar
    // offers the reload that shows it (nothing is reloaded under the user's hands)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      var hadWorker = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update().catch(function () { /* offline */ }); });
        setInterval(function () { reg.update().catch(function () { /* offline */ }); }, 30 * 60 * 1000);
      }).catch(function () { /* not available */ });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadWorker) { hadWorker = true; return; }
        if (document.getElementById('bbUpdate')) return;
        var bar = document.createElement('div'); bar.id = 'bbUpdate';
        bar.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:#1E1B4B;color:#fff;font-weight:600;font-size:14px;box-shadow:0 12px 40px -10px rgba(0,0,0,.5);max-width:92vw';
        bar.innerHTML = '<span>BlitzBook has been updated.</span><button class="btn sm light" id="bbReload">Reload</button>';
        document.body.appendChild(bar);
        document.getElementById('bbReload').onclick = function () { location.reload(); };
      });
    }
  </script>
</body>
</html>
